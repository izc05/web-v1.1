name: Validate and deploy intro lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout intro lab
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install intro dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and build intro lab
        run: npm run check

      - name: Checkout Language School V3
        uses: actions/checkout@v7
        with:
          repository: izc05/LANGUAGE-SCHOOL.
          ref: feat/v3-platform-structure
          path: language-school-v3

      - name: Prepare premium V3 demo for Pages subpath
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('language-school-v3/v3/frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '<BrowserRouter>',
              '<BrowserRouter basename={import.meta.env.BASE_URL}>',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build premium Language School V3 demo
        working-directory: language-school-v3/v3/frontend
        env:
          VITE_APP_MODE: demo
        run: |
          npm ci
          npm run build -- --base=/web-v1.1/premium-v3/

      - name: Add premium demo to Pages artifact
        run: |
          rm -rf dist/premium-v3
          mkdir -p dist/premium-v3
          cp -a language-school-v3/v3/frontend/dist/. dist/premium-v3/

      - name: Checkout Home Premium V2 candidate
        uses: actions/checkout@v7
        with:
          repository: izc05/LANGUAGE-SCHOOL.
          ref: design/home-premium-v2
          path: language-school-home-v2

      - name: Prepare Home V2 candidate for Pages subpath
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('language-school-home-v2/v3/frontend/src/main.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '<BrowserRouter>',
              '<BrowserRouter basename={import.meta.env.BASE_URL}>',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build Home Premium V2 candidate
        working-directory: language-school-home-v2/v3/frontend
        env:
          VITE_APP_MODE: demo
        run: |
          npm ci
          npm run build -- --base=/web-v1.1/home-v2/

      - name: Add Home V2 candidate to Pages artifact
        run: |
          rm -rf dist/home-v2
          mkdir -p dist/home-v2
          cp -a language-school-home-v2/v3/frontend/dist/. dist/home-v2/

      - name: Upload downloadable preview
        uses: actions/upload-artifact@v7
        with:
          name: intro-preview-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
