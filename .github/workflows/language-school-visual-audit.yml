name: Language School exact visual audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.pages-home-v2-source'
      - '.github/workflows/language-school-visual-audit.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Language School candidate
        uses: actions/checkout@v7
        with:
          repository: izc05/LANGUAGE-SCHOOL.
          ref: d746903d9f3951072c7cfae88ad94071c0619cb8
          path: language-school

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build exact demo candidate
        working-directory: language-school/v3/frontend
        env:
          VITE_APP_MODE: demo
        run: |
          npm ci
          npm run build -- --base=/

      - name: Install audit browser
        working-directory: language-school/v3/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Render 7B.1 shell matrix
        working-directory: language-school/v3/e2e
        run: |
          ../frontend/node_modules/.bin/vite preview ../frontend --host 127.0.0.1 --port 4173 > /tmp/language-school-audit-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p visual-audit
          cat > visual-audit.mjs <<'JS'
          import { chromium } from '@playwright/test'
          import fs from 'node:fs'

          const base = 'http://127.0.0.1:4173'
          const viewports = [
            [1440, 1000],
            [1180, 900],
            [820, 1024],
            [390, 844],
          ]
          const metrics = {}

          const browser = await chromium.launch()
          for (const [width, height] of viewports) {
            const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1 })
            await context.addInitScript(() => sessionStorage.setItem('language-school:intro-completed', 'true'))
            const page = await context.newPage()
            await page.goto(base, { waitUntil: 'networkidle' })
            await page.evaluate(() => {
              document.querySelectorAll('.public-reveal').forEach((node) => node.classList.add('is-visible'))
              window.scrollTo(0, 0)
            })
            await page.addStyleTag({ content: `
              *, *::before, *::after { animation: none !important; }
              .public-reveal { opacity: 1 !important; transform: none !important; }
              html { scroll-behavior: auto !important; }
            ` })
            await page.waitForTimeout(180)

            metrics[width] = await page.evaluate(() => {
              const box = (selector) => {
                const node = document.querySelector(selector)
                if (!node) return null
                const rect = node.getBoundingClientRect()
                return { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
              }
              const display = (selector) => {
                const node = document.querySelector(selector)
                return node ? getComputedStyle(node).display : null
              }
              return {
                clientWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                header: box('.site-header'),
                logo: box('.site-header .brand-logo-image'),
                topbarDisplay: display('.academy-topbar'),
                toggleDisplay: display('.nav-toggle'),
                accessDisplay: display('.header-access'),
                footer: box('.site-footer'),
              }
            })

            await page.screenshot({ path: `visual-audit/home-${width}.png`, fullPage: true })

            if (width === 820 || width === 390) {
              const toggle = page.locator('.nav-toggle')
              await toggle.click()
              await page.locator('#public-main-navigation').waitFor({ state: 'visible' })
              await page.waitForTimeout(80)
              metrics[width].menuOpen = await page.evaluate(() => {
                const rect = document.querySelector('#public-main-navigation').getBoundingClientRect()
                const close = document.querySelector('.nav-panel-close').getBoundingClientRect()
                return {
                  width: rect.width,
                  height: rect.height,
                  closeWidth: close.width,
                  closeHeight: close.height,
                  ariaExpanded: document.querySelector('.nav-toggle').getAttribute('aria-expanded'),
                  bodyOverflow: document.body.style.overflow,
                }
              })
              await page.screenshot({ path: `visual-audit/menu-open-${width}.png`, fullPage: false })
              await page.keyboard.press('Escape')
              metrics[width].afterEscape = await page.evaluate(() => ({
                ariaExpanded: document.querySelector('.nav-toggle').getAttribute('aria-expanded'),
                bodyOverflow: document.body.style.overflow,
                focusReturned: document.activeElement?.classList.contains('nav-toggle') || false,
              }))
            }

            await context.close()
          }
          await browser.close()
          fs.writeFileSync('visual-audit/metrics.json', JSON.stringify(metrics, null, 2))
          JS
          node visual-audit.mjs
          printf 'candidate=d746903d9f3951072c7cfae88ad94071c0619cb8\n' > visual-audit/PROVENANCE.txt
          printf 'phase=7B.1\nwidths=1440,1180,820,390\npage=home full-page\nmenu-open=820,390\n' >> visual-audit/PROVENANCE.txt
          printf 'capture=real Chromium render; public reveals forced visible only for deterministic full-page capture\n' >> visual-audit/PROVENANCE.txt

      - name: Upload exact visual audit renders
        uses: actions/upload-artifact@v7
        with:
          name: language-school-7b1-d746-renders
          path: language-school/v3/e2e/visual-audit
          if-no-files-found: error
          retention-days: 7
